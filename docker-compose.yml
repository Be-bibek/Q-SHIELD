version: '3.8'

services:
  qshield-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - QSHIELD_API_HOST=0.0.0.0
      - QSHIELD_API_PORT=8080
      - QSHIELD_STORAGE_DIR=/data/datasets
      - QSHIELD_EXPERIMENTS_DIR=/data/experiments
    volumes:
      - ./datasets:/data/datasets
      - ./experiments:/data/experiments

  qshield-dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - qshield-api
