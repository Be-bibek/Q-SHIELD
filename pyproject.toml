[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qshield"
version = "0.1.0"
description = "Q-SHIELD: Post-Quantum Secure Satellite Image Transmission and Authentication System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Q-SHIELD Research Engineering Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "Pillow>=10.2.0",
    "scikit-image>=0.22.0",
    "tifffile>=2024.1.0",
    "matplotlib>=3.8.0",
    "sgp4>=2.23",
    "skyfield>=1.48",
    "PyWavelets>=1.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "pytest>=8.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]

